name: build-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build/push only (skip VPS deploy)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: jolt-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jolangker/jolt

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHA_SHORT="${GITHUB_SHA::7}"
          TAG="sha-${SHA_SHORT}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "tags=${IMAGE}:latest,${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:latest and ${IMAGE}:${TAG}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=jolt
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # public package = VPS can pull without docker login / extra PAT
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # package name for ghcr.io/jolangker/jolt is "jolt"
          for i in 1 2 3 4 5; do
            if gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/jolt/visibility" \
              -f visibility=public; then
              echo "package visibility: public"
              exit 0
            fi
            echo "visibility update attempt $i failed, retry..."
            sleep 3
          done
          echo "warn: could not set package public — ensure VPS can auth to ghcr or set visibility manually"
          exit 0

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.skip_deploy != true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: IMAGE,TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/jolt
            FULL="${IMAGE}:${TAG}"
            cleanup() { docker logout ghcr.io >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            echo "pulling ${FULL}"
            docker pull "${FULL}"
            docker tag "${FULL}" "${IMAGE}:latest"
            docker tag "${FULL}" jolleyx/jolt:latest
            docker compose up -d --force-recreate --remove-orphans
            sleep 3
            docker ps --filter name=jolt --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            if ! curl -fsS -o /dev/null -w 'local:%{http_code}\n' http://127.0.0.1:3010/; then
              echo "health check failed"
              docker logs jolt --tail 80
              exit 1
            fi
            echo "deploy ok ${FULL}"
