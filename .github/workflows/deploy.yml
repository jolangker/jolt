name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker image tag
        id: set-tag
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            jolleyx/jolt:${{ steps.set-tag.outputs.tag }}
            jolleyx/jolt:${{ github.sha }}
          cache-from: type=registry,ref=jolleyx/jolt:${{ steps.set-tag.outputs.tag }}
          cache-to: type=inline

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Set deployment path
        id: set-path
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "path=${{ secrets.VPS_DEPLOY_PATH_DEV }}" >> $GITHUB_OUTPUT
          else
            echo "path=${{ secrets.VPS_DEPLOY_PATH }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ steps.set-path.outputs.path }}
            sudo docker compose pull
            sudo docker compose down
            sudo docker compose up -d
            sudo docker image prune -f
